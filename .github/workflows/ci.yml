name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Boots the full local stack (Postgres + Auth + Storage) in Docker so
      # migrations that reference auth.users (profiles, buddy_pairing, ...)
      # validate against a real auth schema, not a stub.
      - run: supabase start
      # Reapplies every migration in supabase/migrations from a clean
      # database and loads supabase/seed.sql -- fails the job on the first
      # SQL error, which is the "migration validation" this job exists for.
      - run: supabase db reset
